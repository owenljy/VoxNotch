name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          project = pathlib.Path("VoxNotch.xcodeproj/project.pbxproj").read_text()
          versions = set(re.findall(r"MARKETING_VERSION = ([^;]+);", project))
          builds = set(re.findall(r"CURRENT_PROJECT_VERSION = ([^;]+);", project))
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag) or versions != {tag[1:]}:
              raise SystemExit(f"Release tag {tag} does not match project versions {versions}")
          if len(builds) != 1 or not next(iter(builds)).isdigit():
              raise SystemExit(f"Inconsistent project build numbers: {builds}")
          build = next(iter(builds))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"RELEASE_BUILD={build}\n")
          print(f"Releasing {tag} ({build})")
          PY

      - name: Build Release archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VoxNotch.xcodeproj \
            -scheme VoxNotch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/VoxNotch.xcarchive" \
            -resultBundlePath "$RUNNER_TEMP/Archive.xcresult" \
            -disableAutomaticPackageResolution \
            -skipMacroValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Export and verify app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          cp -R "$RUNNER_TEMP/VoxNotch.xcarchive/Products/Applications/VoxNotch.app" "$RUNNER_TEMP/export/"
          # CODE_SIGNING_ALLOWED=NO leaves a linker-signed executable whose
          # resource seal is incomplete. Seal the exported bundle before DMG.
          codesign --force --sign - \
            --entitlements VoxNotch/VoxNotch.entitlements \
            "$RUNNER_TEMP/export/VoxNotch.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/export/VoxNotch.app"
          app_version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$RUNNER_TEMP/export/VoxNotch.app/Contents/Info.plist")
          app_build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$RUNNER_TEMP/export/VoxNotch.app/Contents/Info.plist")
          test "v$app_version" = "$RELEASE_TAG"
          test "$app_build" = "$RELEASE_BUILD"
          test "$(lipo -archs "$RUNNER_TEMP/export/VoxNotch.app/Contents/MacOS/VoxNotch")" = arm64

      - name: Create DMG and checksum
        run: |
          brew install create-dmg
          create-dmg \
            --skip-jenkins \
            --volname "VoxNotch" \
            --window-size 600 400 \
            --icon "VoxNotch.app" 150 200 \
            --app-drop-link 450 200 \
            "$RUNNER_TEMP/VoxNotch.dmg" \
            "$RUNNER_TEMP/export/"
          cd "$RUNNER_TEMP"
          shasum -a 256 VoxNotch.dmg > VoxNotch.dmg.sha256

      - name: Verify packaged app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          shasum -a 256 -c VoxNotch.dmg.sha256
          hdiutil verify VoxNotch.dmg
          mount_point="$RUNNER_TEMP/release-image"
          mkdir -p "$mount_point"
          hdiutil attach VoxNotch.dmg -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT
          app="$mount_point/VoxNotch.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          test "v$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$RELEASE_TAG"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Contents/Info.plist")" = "$RELEASE_BUILD"
          test "$(lipo -archs "$app/Contents/MacOS/VoxNotch")" = arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/VoxNotch.dmg
            ${{ runner.temp }}/VoxNotch.dmg.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Save archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/Archive.xcresult
          if-no-files-found: ignore
          retention-days: 7
