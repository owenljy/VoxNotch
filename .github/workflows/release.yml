name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      # Stable self-signed identity: macOS keys permissions (microphone, screen
      # recording, accessibility, Keychain) to the designated requirement, so every
      # release must be signed by this exact certificate or users lose their grants.
      SIGNING_CERT_SHA1: A722522038615D41E96104CBE6110D94EAD809B4
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          project = pathlib.Path("VoxNotch.xcodeproj/project.pbxproj").read_text()
          versions = set(re.findall(r"MARKETING_VERSION = ([^;]+);", project))
          builds = set(re.findall(r"CURRENT_PROJECT_VERSION = ([^;]+);", project))
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag) or versions != {tag[1:]}:
              raise SystemExit(f"Release tag {tag} does not match project versions {versions}")
          if len(builds) != 1 or not next(iter(builds)).isdigit():
              raise SystemExit(f"Inconsistent project build numbers: {builds}")
          build = next(iter(builds))
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"RELEASE_BUILD={build}\n")
          print(f"Releasing {tag} ({build})")
          PY

      - name: Build Release archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project VoxNotch.xcodeproj \
            -scheme VoxNotch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/VoxNotch.xcarchive" \
            -resultBundlePath "$RUNNER_TEMP/Archive.xcresult" \
            -disableAutomaticPackageResolution \
            -skipMacroValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo "::error::MACOS_SIGNING_CERT_P12 / MACOS_SIGNING_CERT_PASSWORD secrets are missing"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Self-signed, so it is listed as untrusted; codesign only needs the private key.
          security find-identity -p codesigning "$keychain" | grep -q "$SIGNING_CERT_SHA1" \
            || { echo "::error::Imported certificate does not match SIGNING_CERT_SHA1"; exit 1; }
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Export and verify app version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          app="$RUNNER_TEMP/export/VoxNotch.app"
          cp -R "$RUNNER_TEMP/VoxNotch.xcarchive/Products/Applications/VoxNotch.app" "$RUNNER_TEMP/export/"
          # The archive is built unsigned; sign nested code first, then the bundle.
          find "$app/Contents" \( -name "*.framework" -o -name "*.dylib" -o -name "*.xpc" -o -name "*.appex" \) -prune -print0 |
            while IFS= read -r -d '' item; do
              codesign --force --sign "$SIGNING_CERT_SHA1" --keychain "$SIGNING_KEYCHAIN" --timestamp=none "$item"
            done
          codesign --force --sign "$SIGNING_CERT_SHA1" --keychain "$SIGNING_KEYCHAIN" --timestamp=none \
            --entitlements VoxNotch/VoxNotch.entitlements \
            "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          requirement=$(codesign -d -r- "$app" 2>&1)
          echo "$requirement"
          echo "$requirement" | grep -qi "certificate root = H\"$SIGNING_CERT_SHA1\"" \
            || { echo "::error::Designated requirement is not pinned to the release certificate"; exit 1; }
          app_version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$RUNNER_TEMP/export/VoxNotch.app/Contents/Info.plist")
          app_build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$RUNNER_TEMP/export/VoxNotch.app/Contents/Info.plist")
          test "v$app_version" = "$RELEASE_TAG"
          test "$app_build" = "$RELEASE_BUILD"
          test "$(lipo -archs "$RUNNER_TEMP/export/VoxNotch.app/Contents/MacOS/VoxNotch")" = arm64

      - name: Create DMG and checksum
        run: |
          brew install create-dmg
          create-dmg \
            --skip-jenkins \
            --volname "VoxNotch" \
            --window-size 600 400 \
            --icon "VoxNotch.app" 150 200 \
            --app-drop-link 450 200 \
            "$RUNNER_TEMP/VoxNotch.dmg" \
            "$RUNNER_TEMP/export/"
          cd "$RUNNER_TEMP"
          shasum -a 256 VoxNotch.dmg > VoxNotch.dmg.sha256

      - name: Verify packaged app
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          shasum -a 256 -c VoxNotch.dmg.sha256
          hdiutil verify VoxNotch.dmg
          mount_point="$RUNNER_TEMP/release-image"
          mkdir -p "$mount_point"
          hdiutil attach VoxNotch.dmg -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT
          app="$mount_point/VoxNotch.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d -r- "$app" 2>&1 | grep -qi "certificate root = H\"$SIGNING_CERT_SHA1\""
          test "v$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$RELEASE_TAG"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Contents/Info.plist")" = "$RELEASE_BUILD"
          test "$(lipo -archs "$app/Contents/MacOS/VoxNotch")" = arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/VoxNotch.dmg
            ${{ runner.temp }}/VoxNotch.dmg.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi

      - name: Save archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-log
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/Archive.xcresult
          if-no-files-found: ignore
          retention-days: 7
