name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check model cache compiler workaround
        run: |
          set -euo pipefail
          xcrun swiftc -O -swift-version 5 -default-isolation MainActor \
            -emit-sil -module-name VoxNotch \
            VoxNotch/Services/AlwaysOn/PreparedModelCache.swift \
            -o "$RUNNER_TEMP/PreparedModelCache.sil"
          grep -E '^sil.*\[Onone\].*PreparedModelCacheCfD' "$RUNNER_TEMP/PreparedModelCache.sil"

      - name: Build and test locked dependencies
        run: |
          set -o pipefail
          xcodebuild test \
            -project VoxNotch.xcodeproj \
            -scheme VoxNotch \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -disableAutomaticPackageResolution \
            -skipMacroValidation \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/Tests.xcresult
            ${{ runner.temp }}/tests.log
          retention-days: 7
